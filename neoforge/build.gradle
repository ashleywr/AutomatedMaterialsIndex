plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

base {
    archivesName = "${mod_id}-neoforge-${neoforge_minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def xplatProject = project(':xplat')
def runDirectory = rootProject.ext.minecraftRunDirectory
def amiDebugBuild = providers.gradleProperty('ami_debug_build').map { it.toBoolean() }.getOrElse(false)
def amiEffectiveModVersion = amiDebugBuild ? "${mod_version}-debug" : mod_version

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = runDirectory('neoforge')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        clientJei {
            client()
            gameDirectory = runDirectory('neoforge-jei')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            ideName = 'NeoForge Client JEI'
        }

        clientEmi {
            client()
            gameDirectory = runDirectory('neoforge-emi')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            ideName = 'NeoForge Client EMI'
        }

        clientJeiEmi {
            client()
            gameDirectory = runDirectory('neoforge-jei-emi')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            ideName = 'NeoForge Client JEI+EMI'
        }

        server {
            server()
            gameDirectory = runDirectory('neoforge-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = runDirectory('neoforge-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        clientData {
            clientData()
            gameDirectory = runDirectory('neoforge-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', xplatProject.file('src/main/resources/').absolutePath
        }

        serverData {
            serverData()
            gameDirectory = runDirectory('neoforge-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', xplatProject.file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,LOADING'
            systemProperty 'ami.debugCommands', 'true'
            systemProperty 'ami.registerGameTests', 'true'
            if (System.getProperty('ami.renderProfiler') != null) {
                systemProperty 'ami.renderProfiler', System.getProperty('ami.renderProfiler')
            }
            if (System.getProperty('ami.renderProfiler.frames') != null) {
                systemProperty 'ami.renderProfiler.frames', System.getProperty('ami.renderProfiler.frames')
            }
            systemProperty 'java.io.tmpdir', rootProject.layout.buildDirectory.dir("tmp/minecraft-runs/neoforge/${name}").get().asFile.absolutePath
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArguments.addAll '-ea', '-Dmixin.debug.export=true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets {
    main {
        java.srcDir xplatProject.file('src/main/java')
        resources {
            srcDir 'src/generated/resources'
            srcDir xplatProject.file('src/main/resources')
        }
    }
}

configurations {
    devRuntimeJeiViewerMods {
        canBeConsumed = false
        canBeResolved = true
    }
    devRuntimeEmiViewerMods {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${neoforge_minecraft_version}-neoforge-api:${neoforge_jei_version}"
    compileOnly "mezz.jei:jei-${neoforge_minecraft_version}-neoforge:${neoforge_jei_version}"
    compileOnly "dev.emi:emi-neoforge:1.1.24+1.21.1"

    devRuntimeJeiViewerMods "mezz.jei:jei-${neoforge_minecraft_version}-neoforge:${neoforge_jei_version}"

    compileOnly "dev.latvian.mods:kubejs-neoforge:${neoforge_kubejs_version}"

    compileOnly "it.unimi.dsi:fastutil:8.5.9"

    testImplementation "org.junit.jupiter:junit-jupiter:5.9.3"
    testImplementation "it.unimi.dsi:fastutil:8.5.9"
    testImplementation "org.spongepowered:mixin:0.8.5"
    testImplementation "org.ow2.asm:asm-tree:9.8"
    testImplementation "mezz.jei:jei-${neoforge_minecraft_version}-neoforge-api:${neoforge_jei_version}"
    testImplementation "com.google.code.gson:gson:2.10.1"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.3"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    workingDir = xplatProject.projectDir
}

def registerRecipeViewerModSync = { String taskName, List<String> configurationNames, String runDirName ->
    def viewerConfigurations = configurationNames.collect { configName ->
        configurations.named(configName).get()
    }

    tasks.register(taskName, Copy) {
        def modsDir = runDirectory(runDirName).toPath().resolve('mods').toFile()
        viewerConfigurations.each { configuration ->
            inputs.files(configuration)
        }
        outputs.dir(modsDir)
        into(modsDir)
        from(viewerConfigurations)
    }
}

def cleanClientRecipeViewerMods = tasks.register('cleanClientRecipeViewerMods', Delete) {
    def modsDir = runDirectory('neoforge').toPath().resolve('mods').toFile()
    delete fileTree(modsDir) {
        include 'emi-*.jar'
        include 'jei-*.jar'
    }
}
def syncClientJeiRecipeViewerMods = registerRecipeViewerModSync(
        'syncClientJeiRecipeViewerMods',
        ['devRuntimeJeiViewerMods'],
        'neoforge-jei'
)
def syncClientEmiRecipeViewerMods = registerRecipeViewerModSync(
        'syncClientEmiRecipeViewerMods',
        ['devRuntimeEmiViewerMods'],
        'neoforge-emi'
)
def syncClientJeiEmiRecipeViewerMods = registerRecipeViewerModSync(
        'syncClientJeiEmiRecipeViewerMods',
        ['devRuntimeJeiViewerMods', 'devRuntimeEmiViewerMods'],
        'neoforge-jei-emi'
)

tasks.matching { it.name == 'prepareClientRun' }.configureEach {
    dependsOn cleanClientRecipeViewerMods
}
tasks.matching { it.name == 'prepareClientJeiRun' }.configureEach {
    dependsOn syncClientJeiRecipeViewerMods
}
tasks.matching { it.name == 'prepareClientEmiRun' }.configureEach {
    dependsOn syncClientEmiRecipeViewerMods
}
tasks.matching { it.name == 'prepareClientJeiEmiRun' }.configureEach {
    dependsOn syncClientJeiEmiRecipeViewerMods
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : neoforge_minecraft_version,
            minecraft_version_range: neoforge_minecraft_version_range,
            neo_version            : neoforge_version,
            neo_version_range      : neoforge_version_range,
            loader_version_range   : neoforge_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : amiEffectiveModVersion
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from xplatProject.file('src/main/templates')
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

var generateAmiBuildMetadata = tasks.register('generateAmiBuildMetadata', WriteProperties) {
    destinationFile = layout.buildDirectory.file('generated/resources/amiBuildMetadata/ami-build.properties')
    property 'ami.debugBuild', amiDebugBuild.toString()
    property 'ami.version', amiEffectiveModVersion
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/resources/amiBuildMetadata'))
tasks.named('processResources').configure {
    dependsOn generateAmiBuildMetadata
}

// Compatibility shim for stale IntelliJ Gradle task activations from the old
// 1.21.1 workspace import. ModDevGradle's current task is neoForgeIdeSync.
tasks.register('regutilsIdeSync') {
    group = 'ide'
    description = 'Compatibility alias for old IntelliJ sync task activation.'
    dependsOn tasks.named('neoForgeIdeSync')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

// Release publishing

def changelogText = {
    def f = rootProject.file('CHANGELOG.md')
    if (!f.exists()) return ''
    def text = f.text.replace('\r\n', '\n')
    def start = text.indexOf("## ${mod_version}")
    if (start < 0) return text.trim()
    def next = text.indexOf('\n## ', start + 1)
    return (next < 0 ? text.substring(start) : text.substring(start, next)).trim()
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN') ?: ''
    projectId = 'QOM56zjQ'
    versionNumber = "${mod_version}+neoforge.${neoforge_minecraft_version}"
    versionName = "AMI ${mod_version} (NeoForge ${neoforge_minecraft_version})"
    versionType = 'release'
    uploadFile = tasks.named('jar')
    gameVersions = [neoforge_minecraft_version]
    loaders = ['neoforge']
    detectLoaders = false
    changelog = changelogText()
    dependencies {
        optional.project 'emi'
        optional.project 'jei'
    }
}

if (System.getenv('CURSEFORGE_TOKEN')) {
    curseforge {
        apiKey = System.getenv('CURSEFORGE_TOKEN')
        project {
            id = '1558643'
            releaseType = 'release'
            changelogType = 'markdown'
            changelog = changelogText()
            addGameVersion neoforge_minecraft_version
            addGameVersion 'NeoForge'
            mainArtifact(tasks.jar) {
                displayName = "AMI ${mod_version} (NeoForge ${neoforge_minecraft_version})"
            }
        }
        options {
            javaIntegration = false
            forgeGradleIntegration = false
            javaVersionAutoDetect = false
        }
    }
}

tasks.named('jar', Jar).configure {
    if (amiDebugBuild) {
        archiveClassifier = 'debug'
    }
    if (!providers.gradleProperty('ami_include_dev_artifacts').map { it.toBoolean() }.getOrElse(false)) {
        exclude 'com/sanhiruzu/ami/benchmark/**'
        exclude 'data/ami/structure/ami_benchmark_empty.nbt'
    }
}
