# This is an example forge.mods.toml file. It contains the data relating to the loading mods.
modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory
license = "${mod_license}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
credits = "Ashley" #optional
authors = "Ashley"
description = '''
Search, recipe browsing, and content indexing for large modded Minecraft packs.

AMI groups related blocks and items, adds filters for mods, tags, categories, stats, biomes, structures, and entities, and connects AMI panels with JEI or EMI when installed.
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${ mod_id }]] #optional
modId = "forge" #mandatory
mandatory = true #mandatory
versionRange = "${forge_version_range}" #mandatory
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
