plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version "${moddevgradle_version}"
    id 'com.modrinth.minotaur' version '2.8.7'
    // Pinned below 1.2.x: newer releases are compiled with Java 25 bytecode, which Gradle 8.8's
    // artifact-instrumentation transform can't parse ("Unsupported class file major version 69").
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

base {
    archivesName = "${mod_id}-forge-${forge_minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def runDirectory = rootProject.ext.minecraftRunDirectory
def amiDebugBuild = providers.gradleProperty('ami_debug_build').map { it.toBoolean() }.getOrElse(false)
def amiEffectiveModVersion = amiDebugBuild ? "${mod_version}-debug" : mod_version

legacyForge {
    version = "${forge_minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = forge_parchment_minecraft_version
        mappingsVersion = forge_parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = runDirectory('forge')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        clientJei {
            client()
            gameDirectory = runDirectory('forge-jei')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            ideName = 'Forge Client JEI'
        }

        clientEmi {
            client()
            gameDirectory = runDirectory('forge-emi')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            ideName = 'Forge Client EMI'
        }

        clientJeiEmi {
            client()
            gameDirectory = runDirectory('forge-jei-emi')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            ideName = 'Forge Client JEI+EMI'
        }

        server {
            server()
            gameDirectory = runDirectory('forge-server')
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            gameDirectory = runDirectory('forge-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,LOADING'
            systemProperty 'ami.debugCommands', 'true'
            if (System.getProperty('ami.renderProfiler') != null) {
                systemProperty 'ami.renderProfiler', System.getProperty('ami.renderProfiler')
            }
            if (System.getProperty('ami.renderProfiler.frames') != null) {
                systemProperty 'ami.renderProfiler.frames', System.getProperty('ami.renderProfiler.frames')
            }
            systemProperty 'java.io.tmpdir', rootProject.layout.buildDirectory.dir("tmp/minecraft-runs/forge/${name}").get().asFile.absolutePath
            logLevel = org.slf4j.event.Level.DEBUG
            programArguments.addAll '--mixin', "${mod_id}.mixins.json".toString()
            jvmArguments.addAll '-ea', '-Dmixin.debug.export=true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets {
    main {
        java.srcDir project(':xplat').file('src/main/java')
        resources {
            srcDir 'src/generated/resources'
            srcDir project(':xplat').file('src/main/resources')
        }
    }
}

configurations {
    devRuntimeJeiViewerMods {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE, objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
        }
    }
    devRuntimeEmiViewerMods {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE, objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
        }
    }
}

dependencies {
    modCompileOnly "mezz.jei:jei-${forge_minecraft_version}-forge-api:${forge_jei_version}"
    modCompileOnly "mezz.jei:jei-${forge_minecraft_version}-forge:${forge_jei_version}"
    modCompileOnly "dev.emi:emi-forge:${forge_emi_version}+${forge_minecraft_version}"

    devRuntimeJeiViewerMods "mezz.jei:jei-${forge_minecraft_version}-forge:${forge_jei_version}"
    devRuntimeEmiViewerMods "dev.emi:emi-forge:${forge_emi_version}+${forge_minecraft_version}"

    implementation "it.unimi.dsi:fastutil:8.5.12"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation "org.junit.jupiter:junit-jupiter:5.9.3"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.3"
}

tasks.named('test').configure {
    useJUnitPlatform()
}

def registerRecipeViewerModCleanup = { String taskName, String runDirName ->
    tasks.register(taskName, Delete) {
        def modsDir = runDirectory(runDirName).toPath().resolve('mods').toFile()
        delete fileTree(modsDir) {
            include 'emi-*.jar'
            include 'jei-*.jar'
        }
    }
}

def registerRecipeViewerModSync = { String taskName, List<String> configurationNames, String runDirName, TaskProvider<Delete> cleanupTask ->
    def jeiJarName = "jei-${forge_minecraft_version}-forge-${forge_jei_version}.jar"
    def emiJarName = "emi-forge-${forge_emi_version}+${forge_minecraft_version}.jar"

    tasks.register(taskName, Copy) {
        def modsDir = runDirectory(runDirName).toPath().resolve('mods').toFile()
        dependsOn cleanupTask
        def includeJei = configurationNames.contains('devRuntimeJeiViewerMods')
        def includeEmi = configurationNames.contains('devRuntimeEmiViewerMods')
        def viewerFiles = configurations.compileClasspath.filter { file ->
            (includeJei && file.name == jeiJarName) ||
                    (includeEmi && file.name == emiJarName)
        }
        inputs.files(viewerFiles)
        outputs.dir(modsDir)
        into(modsDir)
        from(viewerFiles)
    }
}

def cleanClientRecipeViewerMods = registerRecipeViewerModCleanup(
        'cleanClientRecipeViewerMods',
        'forge'
)
def cleanClientJeiRecipeViewerMods = registerRecipeViewerModCleanup(
        'cleanClientJeiRecipeViewerMods',
        'forge-jei'
)
def cleanClientEmiRecipeViewerMods = registerRecipeViewerModCleanup(
        'cleanClientEmiRecipeViewerMods',
        'forge-emi'
)
def cleanClientJeiEmiRecipeViewerMods = registerRecipeViewerModCleanup(
        'cleanClientJeiEmiRecipeViewerMods',
        'forge-jei-emi'
)

def syncClientRecipeViewerMods = registerRecipeViewerModSync(
        'syncClientRecipeViewerMods',
        [],
        'forge',
        cleanClientRecipeViewerMods
)
def syncClientJeiRecipeViewerMods = registerRecipeViewerModSync(
        'syncClientJeiRecipeViewerMods',
        ['devRuntimeJeiViewerMods'],
        'forge-jei',
        cleanClientJeiRecipeViewerMods
)
def syncClientEmiRecipeViewerMods = registerRecipeViewerModSync(
        'syncClientEmiRecipeViewerMods',
        ['devRuntimeEmiViewerMods'],
        'forge-emi',
        cleanClientEmiRecipeViewerMods
)
def syncClientJeiEmiRecipeViewerMods = registerRecipeViewerModSync(
        'syncClientJeiEmiRecipeViewerMods',
        ['devRuntimeJeiViewerMods', 'devRuntimeEmiViewerMods'],
        'forge-jei-emi',
        cleanClientJeiEmiRecipeViewerMods
)

tasks.matching { it.name == 'prepareClientRun' }.configureEach {
    dependsOn syncClientRecipeViewerMods
}
tasks.matching { it.name == 'prepareClientJeiRun' }.configureEach {
    dependsOn syncClientJeiRecipeViewerMods
}
tasks.matching { it.name == 'prepareClientEmiRun' }.configureEach {
    dependsOn syncClientEmiRecipeViewerMods
}
tasks.matching { it.name == 'prepareClientJeiEmiRun' }.configureEach {
    dependsOn syncClientJeiEmiRecipeViewerMods
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : forge_minecraft_version,
            minecraft_version_range: forge_minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : forge_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : amiEffectiveModVersion,
            mod_group_id           : mod_group_id
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

var generateAmiBuildMetadata = tasks.register('generateAmiBuildMetadata', WriteProperties) {
    destinationFile = layout.buildDirectory.file('generated/resources/amiBuildMetadata/ami-build.properties')
    property 'ami.debugBuild', amiDebugBuild.toString()
    property 'ami.version', amiEffectiveModVersion
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/resources/amiBuildMetadata'))
tasks.named('processResources').configure {
    dependsOn generateAmiBuildMetadata
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
            'MixinConfigs': "${mod_id}.mixins.json"
    ])
    if (!providers.gradleProperty('ami_include_dev_artifacts').map { it.toBoolean() }.getOrElse(false)) {
        exclude 'com/sanhiruzu/ami/benchmark/**'
        exclude 'data/ami/structure/ami_benchmark_empty.nbt'
    }
}

def forgeReobfuscatedJarFile = layout.buildDirectory.file("libs/${mod_id}-forge-${forge_minecraft_version}-${amiEffectiveModVersion}.jar")
def forgeReleaseJarFile = layout.buildDirectory.file("release/${mod_id}-forge-${forge_minecraft_version}-${amiEffectiveModVersion}.jar")

def forgeReleaseJar = tasks.register('forgeReleaseJar', Copy) {
    group = 'build'
    description = 'Copies the reobfuscated Forge jar to the release upload location.'
    dependsOn tasks.named('reobfJar')
    from(forgeReobfuscatedJarFile)
    into(layout.buildDirectory.dir('release'))
    rename { forgeReleaseJarFile.get().asFile.name }
    outputs.file(forgeReleaseJarFile)
}

tasks.register('verifyForgeReleaseJarReobfuscated') {
    group = 'verification'
    description = 'Fails if the Forge release jar still contains named Minecraft runtime method calls.'
    dependsOn forgeReleaseJar
    inputs.file(forgeReleaseJarFile)

    doLast {
        def jar = forgeReleaseJarFile.get().asFile
        def zip = new java.util.zip.ZipFile(jar)
        try {
            def readClass = { String path ->
                def entry = zip.getEntry(path)
                if (entry == null) {
                    throw new GradleException("Missing class in Forge release jar: ${path}")
                }
                zip.getInputStream(entry).withCloseable { stream ->
                    new String(stream.bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                }
            }

            def amiMode = readClass('com/sanhiruzu/ami/config/AmiConfig$AmiMode.class')
            if (amiMode.contains('translatable') || !amiMode.contains('m_237115_')) {
                throw new GradleException("Forge release jar is not reobfuscated: AmiConfig\$AmiMode still references Component.translatable")
            }

            def themeLoader = readClass('com/sanhiruzu/ami/client/ThemeResourceLoader.class')
            if (!themeLoader.contains('m_5787_')) {
                throw new GradleException("Forge release jar is not reobfuscated: ThemeResourceLoader is missing SimplePreparableReloadListener.m_5787_")
            }

            def contextMenuActions = readClass('com/sanhiruzu/ami/client/results/ResultContextMenuActionBuilder.class')
            if (contextMenuActions.contains('getMethod') && contextMenuActions.contains('tell')) {
                throw new GradleException("Forge release jar contains reflective Minecraft.tell lookup; context menu actions will fail in production Forge")
            }

            def forgePlatformHelper = readClass('com/sanhiruzu/ami/forge/ForgePlatformHelper.class')
            if (!forgePlatformHelper.contains('m_85915_') || !forgePlatformHelper.contains('m_231202_')) {
                throw new GradleException("Forge release jar is missing SRG fallbacks for reflective ForgePlatformHelper rendering")
            }
        } finally {
            zip.close()
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

// Release publishing

def changelogText = {
    def f = rootProject.file('CHANGELOG.md')
    if (!f.exists()) return ''
    def text = f.text.replace('\r\n', '\n')
    def start = text.indexOf("## ${mod_version}")
    if (start < 0) return text.trim()
    def next = text.indexOf('\n## ', start + 1)
    return (next < 0 ? text.substring(start) : text.substring(start, next)).trim()
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN') ?: ''
    projectId = 'QOM56zjQ'
    versionNumber = "${mod_version}+forge.${forge_minecraft_version}"
    versionName = "AMI ${mod_version} (Forge ${forge_minecraft_version})"
    versionType = 'release'
    uploadFile = forgeReleaseJarFile
    gameVersions = [forge_minecraft_version]
    loaders = ['forge']
    detectLoaders = false
    changelog = changelogText()
    dependencies {
        optional.project 'emi'
        optional.project 'jei'
    }
}

tasks.named('modrinth').configure {
    dependsOn tasks.named('verifyForgeReleaseJarReobfuscated')
}

if (System.getenv('CURSEFORGE_TOKEN')) {
    task curseforge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        apiToken = System.getenv('CURSEFORGE_TOKEN')
        def mainFile = upload('1558643', forgeReleaseJarFile)
        mainFile.releaseType = 'release'
        mainFile.changelogType = 'markdown'
        mainFile.changelog = changelogText()
        mainFile.displayName = "AMI ${mod_version} (Forge ${forge_minecraft_version})"
        mainFile.addGameVersion(forge_minecraft_version)
        mainFile.addModLoader('Forge')
        mainFile.addEnvironment('Client')
    }

    tasks.matching { it.name.startsWith('curseforge') }.configureEach {
        dependsOn tasks.named('verifyForgeReleaseJarReobfuscated')
    }
}
