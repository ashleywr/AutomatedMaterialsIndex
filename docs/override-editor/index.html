<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AMI Override Editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/css/tabulator_midnight.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/js/tabulator.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>
<body>
  <header>
    <h1>AMI Override Editor</h1>
    <label class="file-label">Dump <input type="file" id="dump-input" accept="application/json"></label>
    <label class="file-label">Overrides <input type="file" id="overrides-input" accept="application/json"></label>
    <div id="status">No files loaded.</div>
    <button id="download" disabled>Download overrides.json</button>
  </header>

  <div id="main">
    <nav id="tree-panel">
      <p class="tree-empty">Load a dump to see the classification tree.</p>
    </nav>

    <div id="content-panel">
      <div id="toolbar">
        <input id="filter-text" type="search" placeholder="Search id / name / mod…">
        <label class="check-label"><input type="checkbox" id="filter-dirty-only"> Edited only</label>
        <div id="issues"></div>
      </div>
      <div id="grid-host"></div>
      <div id="action-bar" hidden>
        <span id="sel-count"></span>
        <span class="action-sep">→ Move to:</span>
        <select id="move-cat"></select>
        <select id="move-sub"></select>
        <button id="move-apply">Move</button>
        <button id="sel-clear">Clear</button>
      </div>
    </div>
  </div>

  <!-- Facets + tooltip edit dialog (rare; opened via ✎ button) -->
  <div id="item-edit" hidden>
    <div id="ie-titlebar">
      <span id="ie-title">Edit item</span>
      <button id="ie-close">&#x2715;</button>
    </div>
    <div id="ie-body">
      <div class="ie-row"><label>Facets</label><select id="ie-facets" multiple></select></div>
      <div class="ie-row"><label>Tooltip lines (one per line)</label><textarea id="ie-tooltip" rows="5"></textarea></div>
    </div>
    <div id="ie-footer">
      <button id="ie-apply">Apply</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
