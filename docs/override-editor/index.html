<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AMI Override Editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/css/tabulator_midnight.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.2.5/dist/js/tabulator.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>
<body>
  <header>
    <h1>AMI Override Editor</h1>
    <div id="status">No files loaded.</div>
  </header>

  <section id="load">
    <label>Registry dump (registry-dump.json):
      <input type="file" id="dump-input" accept="application/json">
    </label>
    <label>Existing overrides (optional, overrides.json):
      <input type="file" id="overrides-input" accept="application/json">
    </label>
  </section>

  <section id="filters">
    <input id="filter-text" type="search" placeholder="Filter by id / display name / mod">
    <select id="filter-mod"><option value="">(all mods)</option></select>
    <select id="filter-category"><option value="">(all categories)</option></select>
    <label><input type="checkbox" id="filter-dirty-only"> Show edited only</label>
  </section>

  <section id="bulk">
    <strong>Bulk edit selected:</strong>
    <div class="bulk-field"><label>Category</label><select id="bulk-category"></select></div>
    <div class="bulk-field"><label>Subcategory</label><select id="bulk-subcategory"></select></div>
    <div class="bulk-field"><label>Add facet</label><select id="bulk-add-facet"></select></div>
    <div class="bulk-field"><label>Remove facet</label><select id="bulk-remove-facet"></select></div>
    <button id="bulk-apply">Apply to selected</button>
  </section>

  <main id="grid-host"></main>

  <div id="single-edit" hidden>
    <div id="se-titlebar">
      <span id="se-title">Edit item</span>
      <button id="se-close" aria-label="Close">&#x2715;</button>
    </div>
    <div id="se-body">
      <div class="se-row"><label>Category</label><select id="se-cat"></select></div>
      <div class="se-row"><label>Subcategory</label><select id="se-sub"></select></div>
      <div class="se-row"><label>Facets</label><select id="se-facets" multiple></select></div>
      <div class="se-row"><label>Tooltip lines (one per line)</label><textarea id="se-tooltip" rows="4"></textarea></div>
    </div>
    <div id="se-footer">
      <button id="se-apply">Apply</button>
    </div>
  </div>

  <footer>
    <button id="download" disabled>Download overrides.json</button>
    <div id="issues"></div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
