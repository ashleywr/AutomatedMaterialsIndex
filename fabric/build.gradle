plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom' version "${fabric_loom_version}"
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

base {
    archivesName = "${mod_id}-fabric-${fabric_minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def xplatProject = project(':xplat')

sourceSets {
    main {
        java.srcDir xplatProject.file('src/main/java')
        resources {
            srcDir xplatProject.file('src/main/resources')
        }
    }
    test {
        java.srcDirs = ['src/test/java']
    }
}

loom {
    accessWidenerPath = file('src/main/resources/ami.accesswidener')
    mixin {
        defaultRefmapName = 'ami.refmap.json'
    }
    runs {
        client { client() }
        server { server() }
    }
}

// The repo enables Gradle's configuration cache globally (org.gradle.configuration-cache=true)
// for NeoForge's ModDevGradle, but Fabric Loom's run tasks are not configuration-cache
// compatible (they serialize SourceSet and call Task.project at execution time). Mark them
// so a build that includes a run task disables the config cache for that invocation instead
// of failing — mirrors how the root build.gradle handles its Prism deploy tasks.
tasks.withType(net.fabricmc.loom.task.RunGameTask).configureEach {
    notCompatibleWithConfigurationCache('Fabric Loom run tasks are not configuration-cache compatible')
}

dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modCompileOnly "mezz.jei:jei-${fabric_minecraft_version}-fabric-api:${fabric_jei_version}"
    modCompileOnly "mezz.jei:jei-${fabric_minecraft_version}-fabric:${fabric_jei_version}"

    modCompileOnly "dev.emi:emi-fabric:${fabric_emi_version}+${fabric_minecraft_version}"

    // Recipe-viewer mods are only present in :fabric:runClient when explicitly requested,
    // because JEI and EMI conflict and must be tested separately (mirrors the NeoForge
    // clientJei / clientEmi / clientJeiEmi split). Select with -Pami.viewer=jei|emi|jei_emi.
    // JEI's Fabric build needs its companion -gui/-lib/-common artifacts, which it pulls in
    // transitively, so the runtime jar is enough.
    def amiViewer = providers.gradleProperty('ami.viewer').getOrElse('none').toLowerCase()
    if (amiViewer in ['jei', 'jei_emi']) {
        modLocalRuntime "mezz.jei:jei-${fabric_minecraft_version}-fabric:${fabric_jei_version}"
    }
    if (amiViewer in ['emi', 'jei_emi']) {
        modLocalRuntime "dev.emi:emi-fabric:${fabric_emi_version}+${fabric_minecraft_version}"
    }

    compileOnly 'it.unimi.dsi:fastutil:8.5.9'

    testImplementation "org.junit.jupiter:junit-jupiter:5.9.3"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.3"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

// Compatibility shim for stale IntelliJ Gradle task activations carried over from
// the NeoForge-only workspace (which defines regutilsIdeSync as an alias for its
// ModDevGradle IDE sync). Fabric Loom generates its run configs automatically on
// project import, so this only needs to exist as a no-op so the post-sync task
// activation resolves against :fabric instead of failing.
tasks.register('regutilsIdeSync') {
    group = 'ide'
    description = 'No-op compatibility alias for stale IntelliJ sync task activation.'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

// Release publishing — mirrors neoforge/build.gradle, but the publishable artifact is
// Loom's remapJar (the production, intermediary-remapped jar), NOT the dev jar.

def changelogText = {
    def f = rootProject.file('CHANGELOG.md')
    if (!f.exists()) return ''
    def text = f.text.replace('\r\n', '\n')
    def start = text.indexOf("## ${mod_version}")
    if (start < 0) return text.trim()
    def next = text.indexOf('\n## ', start + 1)
    return (next < 0 ? text.substring(start) : text.substring(start, next)).trim()
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN') ?: ''
    projectId = 'QOM56zjQ'
    versionNumber = "${mod_version}+fabric.${fabric_minecraft_version}"
    versionName = "AMI ${mod_version} (Fabric ${fabric_minecraft_version})"
    versionType = 'release'
    uploadFile = tasks.named('remapJar')
    gameVersions = [fabric_minecraft_version]
    loaders = ['fabric']
    detectLoaders = false
    changelog = changelogText()
    dependencies {
        required.project 'fabric-api'
        optional.project 'emi'
        optional.project 'jei'
    }
}

if (System.getenv('CURSEFORGE_TOKEN')) {
    curseforge {
        apiKey = System.getenv('CURSEFORGE_TOKEN')
        project {
            id = '1558643'
            releaseType = 'release'
            changelogType = 'markdown'
            changelog = changelogText()
            addGameVersion fabric_minecraft_version
            addGameVersion 'Fabric'
            mainArtifact(tasks.remapJar) {
                displayName = "AMI ${mod_version} (Fabric ${fabric_minecraft_version})"
            }
            relations {
                requiredDependency 'fabric-api'
                optionalDependency 'jei'
                optionalDependency 'emi'
            }
        }
        options {
            javaIntegration = false
            forgeGradleIntegration = false
            javaVersionAutoDetect = false
        }
    }
}
