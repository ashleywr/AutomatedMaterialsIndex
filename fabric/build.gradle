plugins {
    id 'java-library'
    id 'fabric-loom' version "${fabric_loom_version}"
}

base {
    archivesName = "${mod_id}-fabric-${fabric_minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def xplatProject = project(':xplat')

sourceSets {
    main {
        java.srcDir xplatProject.file('src/main/java')
        resources {
            srcDir xplatProject.file('src/main/resources')
        }
    }
    test {
        java.srcDirs = ['src/test/java']
    }
}

loom {
    accessWidenerPath = file('src/main/resources/ami.accesswidener')
    mixin {
        defaultRefmapName = 'ami.refmap.json'
    }
    runs {
        client { client() }
        server { server() }
    }
}

// The repo enables Gradle's configuration cache globally (org.gradle.configuration-cache=true)
// for NeoForge's ModDevGradle, but Fabric Loom's run tasks are not configuration-cache
// compatible (they serialize SourceSet and call Task.project at execution time). Mark them
// so a build that includes a run task disables the config cache for that invocation instead
// of failing — mirrors how the root build.gradle handles its Prism deploy tasks.
tasks.withType(net.fabricmc.loom.task.RunGameTask).configureEach {
    notCompatibleWithConfigurationCache('Fabric Loom run tasks are not configuration-cache compatible')
}

dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modCompileOnly "mezz.jei:jei-${fabric_minecraft_version}-fabric-api:${fabric_jei_version}"
    modCompileOnly "mezz.jei:jei-${fabric_minecraft_version}-fabric:${fabric_jei_version}"

    modCompileOnly "dev.emi:emi-fabric:${fabric_emi_version}+${fabric_minecraft_version}"

    // Recipe-viewer mods are only present in :fabric:runClient when explicitly requested,
    // because JEI and EMI conflict and must be tested separately (mirrors the NeoForge
    // clientJei / clientEmi / clientJeiEmi split). Select with -Pami.viewer=jei|emi|jei_emi.
    // JEI's Fabric build needs its companion -gui/-lib/-common artifacts, which it pulls in
    // transitively, so the runtime jar is enough.
    def amiViewer = providers.gradleProperty('ami.viewer').getOrElse('none').toLowerCase()
    if (amiViewer in ['jei', 'jei_emi']) {
        modLocalRuntime "mezz.jei:jei-${fabric_minecraft_version}-fabric:${fabric_jei_version}"
    }
    if (amiViewer in ['emi', 'jei_emi']) {
        modLocalRuntime "dev.emi:emi-fabric:${fabric_emi_version}+${fabric_minecraft_version}"
    }

    compileOnly 'it.unimi.dsi:fastutil:8.5.9'

    testImplementation "org.junit.jupiter:junit-jupiter:5.9.3"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.3"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
