    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', rootProject.file('scripts/write-vanilla-ftb-quests-fixture.ps1').absolutePath,
            '-AmiRepo', rootProject.projectDir.absolutePath,
            '-RunName', 'neoforge-emi',
            '-CleanGenerated'
}

def prismInstancesDir = providers.gradleProperty('amiPrismInstancesDir')
        .orElse(providers.environmentVariable('PRISM_INSTANCES_DIR'))
        .orElse(providers.environmentVariable('APPDATA').map { "${it}/PrismLauncher/instances" })

def registerPrismCompatJarDeploy = { String taskName,
                                    String description,
                                    String jarTaskPath,
                                    Object jarFileSource,
                                    String instanceName,
                                    String staleJarPrefix ->
    def modsDir = prismInstancesDir.map { instancesDir ->
        layout.projectDirectory.file("${instancesDir}/${instanceName}/minecraft/mods").asFile
    }
    def cleanTask = tasks.register("${taskName}Clean", Delete) {
        notCompatibleWithConfigurationCache('Local Prism deployment deletes files from a user-specific directory.')
        delete modsDir.map { target ->
            if (!target.directory) {
                return []
            }
            target.listFiles()
                    ?.findAll { file -> file.name.startsWith(staleJarPrefix) && file.name.endsWith('.jar') }
                    ?: []
        }
    }

    tasks.register(taskName, Copy) {
        notCompatibleWithConfigurationCache('Local Prism deployment copies files into a user-specific directory.')
        group = 'deployment'
        description = description

        dependsOn jarTaskPath
        dependsOn cleanTask
        from(jarFileSource)
        into(modsDir)
    }
}

def neoForgePrismJarFile = project(':neoforge').layout.buildDirectory.file(
        amiDebugBuild
                ? "libs/${mod_id}-neoforge-${neoforge_minecraft_version}-${mod_version}-debug.jar"
                : "libs/${mod_id}-neoforge-${neoforge_minecraft_version}-${mod_version}.jar"
)

def deployNeoForgePrismCompatJar = registerPrismCompatJarDeploy(
        'deployNeoForgePrismCompatJar',
        'Builds and copies the NeoForge AMI jar into the Prism AMICompat instance.',
        ':neoforge:jar',
        neoForgePrismJarFile,
        'AMICompat',
        'ami-neoforge-'
)

tasks.register('deployPrismCompatJars') {
    group = 'deployment'
    description = 'Builds AMI and updates the AMICompat Prism Launcher instance.'
    dependsOn deployNeoForgePrismCompatJar
}

