tasks.register('cleanLocalRuntime', Delete) {
    group = 'build'
    description = 'Deletes disposable local Minecraft runtime output from the repository root.'
    delete rootProject.file('.mixin.out')
    delete rootProject.file('.pg-native')
    delete rootProject.file('config')
    delete rootProject.file('crash-reports')
    delete rootProject.file('defaultconfigs')
    delete rootProject.file('logs')
    delete {
        rootDir.listFiles()?.findAll { it.directory && it.name.startsWith('run-') } ?: []
    }
}

tasks.register('cleanRuns', Delete) {
    group = 'build'
    description = 'Deletes all disposable Minecraft run directories under run/.'
    delete layout.projectDirectory.dir('run')
}

tasks.register('writeVanillaFtbQuestFixture', Exec) {
    group = 'verification'
