plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // EMI local snapshot (published to local Maven cache)
    mavenLocal()
    // JEI
    maven { url = "https://maven.blamejared.com" }
    // EMI (via Modrinth Maven — more reliable than maven.emi.dev for classifier builds)
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientJei {
            client()
            gameDirectory = project.file('run-jei')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            ideName = 'Client JEI'
        }

        clientEmi {
            client()
            gameDirectory = project.file('run-emi')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            ideName = 'Client EMI'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        amiBenchmarks {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'ami.benchmark.iterations', findProperty('ami_benchmark_iterations') ?: '120'
            systemProperty 'forge.logging.markers', ''
            jvmArguments.addAll '-Xms512m', '-Xmx2G', '-XX:+UseG1GC'
        }

        amiOntologyDump {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'ami.ontology_dump_mode', 'true'
            systemProperty 'forge.logging.markers', ''
            jvmArguments.addAll '-Xms512m', '-Xmx2G', '-XX:+UseG1GC'
        }

        amiFallbackDump {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'ami.fallback_dump_mode', 'true'
            systemProperty 'forge.logging.markers', ''
            jvmArguments.addAll '-Xms512m', '-Xmx2G', '-XX:+UseG1GC'
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Logging markers (comma-separated):
            //   SCAN          - mod scanning phase, shows what's being picked up
            //   REGISTRIES    - registry event firing
            //   REGISTRYDUMP  - full dump of all registry contents (very noisy, enable only when debugging a specific registry)
            //   LOADING       - mod loading lifecycle events
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,LOADING'

            logLevel = org.slf4j.event.Level.DEBUG

            // Enable Java assertions — catches contract violations (e.g. assert x != null) that
            // would otherwise silently produce wrong results instead of failing fast.
            jvmArguments.addAll '-ea', '-Dmixin.debug.export=true'
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// dev_recipe_viewer controls which recipe viewer runs in the default client dev run.
// Both are always on the compile classpath so AMI can reference both APIs.
// Values: none | emi | jei | both (default: both)
def devRecipeViewer = findProperty('dev_recipe_viewer') ?: 'both'

configurations {
    devRuntimeRecipeViewerMods {
        canBeConsumed = false
        canBeResolved = true
    }
    devRuntimeJeiViewerMods {
        canBeConsumed = false
        canBeResolved = true
    }
    devRuntimeEmiViewerMods {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"

    if (devRecipeViewer == 'jei' || devRecipeViewer == 'both') {
        devRuntimeRecipeViewerMods "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
    if (devRecipeViewer == 'emi' || devRecipeViewer == 'both') {
        devRuntimeRecipeViewerMods "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"
    }

    // Use fastutil for a high-performance primitive-friendly trie (compileOnly)
    compileOnly "it.unimi.dsi:fastutil:8.5.9"

    // Test dependencies (runtime for unit tests)
    testImplementation "org.junit.jupiter:junit-jupiter:5.9.3"
    testImplementation "it.unimi.dsi:fastutil:8.5.9"
    testImplementation "org.spongepowered:mixin:0.8.5"
    testImplementation "org.ow2.asm:asm-tree:9.7.1"
    testImplementation "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.3"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

dependencies {
    devRuntimeJeiViewerMods "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    devRuntimeEmiViewerMods "dev.emi:emi-neoforge:${emi_version}+${minecraft_version}"
}

def recipeViewerModPatterns = ['*jei*.jar', '*emi*.jar']

def registerRecipeViewerModSync = { String taskName, List<String> configurationNames, String runDirName ->
    def viewerConfigurations = configurationNames.collect { configName ->
        configurations.named(configName).get()
    }

    tasks.register(taskName, Copy) {
        def modsDir = project.file("${runDirName}/mods")
        viewerConfigurations.each { configuration ->
            inputs.files(configuration)
        }
        outputs.dir(modsDir)
        into(modsDir)
        from(viewerConfigurations)

        doFirst {
            modsDir.mkdirs()

            def staleViewerJars = modsDir.listFiles()?.findAll { file ->
                file.isFile() && recipeViewerModPatterns.any { pattern ->
                    def regex = pattern.replace('.', '\\.').replace('*', '.*')
                    file.name ==~ regex
                }
            } ?: []
            staleViewerJars.each { staleJar ->
                staleJar.delete()
            }
        }
    }
}

def syncClientRecipeViewerMods = registerRecipeViewerModSync(
        'syncClientRecipeViewerMods',
        ['devRuntimeRecipeViewerMods'],
        'run'
)
def syncClientJeiRecipeViewerMods = registerRecipeViewerModSync(
        'syncClientJeiRecipeViewerMods',
        ['devRuntimeJeiViewerMods'],
        'run-jei'
)
def syncClientEmiRecipeViewerMods = registerRecipeViewerModSync(
        'syncClientEmiRecipeViewerMods',
        ['devRuntimeEmiViewerMods'],
        'run-emi'
)

tasks.named('prepareClientRun').configure {
    dependsOn syncClientRecipeViewerMods
}

tasks.named('prepareClientJeiRun').configure {
    dependsOn syncClientJeiRecipeViewerMods
}

tasks.named('prepareClientEmiRun').configure {
    dependsOn syncClientEmiRecipeViewerMods
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Configure test task to use JUnit Platform (JUnit 5)
test {
    useJUnitPlatform()
}

tasks.named('check').configure {
    dependsOn tasks.named('runAmiBenchmarks')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('clearAmiCacheAndConfig', Delete) {
    group = 'build'
    description = 'Clears AMI configuration files and cache directories in the run folder.'
    delete fileTree(dir: 'run/config', include: 'ami-client*.toml')
    delete fileTree(dir: 'run/config', include: 'ami-layout.toml')
    delete 'run/config/ami'
}

// Copy built JAR to Prism Launcher mods folder
def modsFolder = new File(System.getenv('APPDATA'), 'PrismLauncher/instances/Mod Making/minecraft/mods')

tasks.register('copyToModsFolder', Copy) {
    from tasks.named('jar')
    into modsFolder
    doFirst {
        println "Copying AMI JAR to ${modsFolder.absolutePath}"
    }
    doLast {
        println "[SUCCESS] AMI JAR copied to mods folder"
    }
}

tasks.named('build').configure {
    finalizedBy copyToModsFolder
}

tasks.register('analyzeOntology', Exec) {
    group = 'verification'
    description = 'Headlessly dumps the AMI ontology and runs the local LLM analyzer on the output.'
    dependsOn 'runAmiOntologyDump'

    def isVanillaIncluded = project.hasProperty('includeVanilla') && project.property('includeVanilla') == 'true'
    def baseArgs = ['python', 'internal/local_llm_analyzer.py']
    if (isVanillaIncluded) {
        baseArgs.add('--include-vanilla')
    }
    // The gameTestServer run config usually uses 'run-gameTestServer' or 'run' as its working directory.
    // NeoForge 20+ run folders are inside the root directory. We'll pass both potential paths to the script.
    baseArgs.addAll(['run/ami_dumps/ontology_dump.csv', 'run-gameTestServer/ami_dumps/ontology_dump.csv'])

    commandLine baseArgs
    
    doLast {
        println "Ontology analysis complete. Summary printed above."
    }
}

tasks.register('sampleFacetFallback') {
    group = 'verification'
    description = 'Headlessly exports the remaining facet fallback population to CSV.'
    dependsOn 'runAmiFallbackDump'

    doLast {
        println "Facet fallback sample exported to run/ami_dumps/facet_fallback_sample.csv (or run-gameTestServer equivalent)."
    }
}

