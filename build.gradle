def prismInstancesDir = providers.gradleProperty('amiPrismInstancesDir')
        .orElse(providers.environmentVariable('PRISM_INSTANCES_DIR'))
        .orElse(providers.environmentVariable('APPDATA').map { "${it}/PrismLauncher/instances" })

def registerPrismCompatJarDeploy = { String taskName,
                                    String description,
                                    String jarTaskPath,
                                    Object jarFileSource,
                                    String instanceName,
                                    String staleJarPrefix ->
    def modsDir = prismInstancesDir.map { instancesDir ->
        layout.projectDirectory.file("${instancesDir}/${instanceName}/minecraft/mods").asFile
    }
    def cleanTask = tasks.register("${taskName}Clean", Delete) {
        notCompatibleWithConfigurationCache('Local Prism deployment deletes files from a user-specific directory.')
        delete modsDir.map { target ->
            if (!target.directory) {
                return []
            }
            target.listFiles()
                    ?.findAll { file -> file.name.startsWith(staleJarPrefix) && file.name.endsWith('.jar') }
                    ?: []
        }
    }

    tasks.register(taskName, Copy) {
        notCompatibleWithConfigurationCache('Local Prism deployment copies files into a user-specific directory.')
        group = 'deployment'
        description = description

        dependsOn jarTaskPath
        dependsOn cleanTask
        from(jarFileSource)
        into(modsDir)
    }
}

def neoForgePrismJarFile = project(':neoforge').layout.buildDirectory.file(
        amiDebugBuild
                ? "libs/${mod_id}-neoforge-${neoforge_minecraft_version}-${mod_version}-debug.jar"
                : "libs/${mod_id}-neoforge-${neoforge_minecraft_version}-${mod_version}.jar"
)
def forgePrismJarFile = project(':forge').layout.buildDirectory.file(
        "release/${mod_id}-forge-${forge_minecraft_version}-${amiEffectiveModVersion}.jar"
)

def deployNeoForgePrismCompatJar = registerPrismCompatJarDeploy(
        'deployNeoForgePrismCompatJar',
        'Builds and copies the NeoForge AMI jar into the Prism AMICompat instance.',
        ':neoforge:jar',
        neoForgePrismJarFile,
        'AMICompat',
        'ami-neoforge-'
)

def deployForgePrismCompatJar = registerPrismCompatJarDeploy(
        'deployForgePrismCompatJar',
        'Builds and copies the reobfuscated Forge AMI jar into the Prism AMICompatForge instance.',
        ':forge:forgeReleaseJar',
        forgePrismJarFile,
        'AMICompatForge',
        'ami-forge-'
)

tasks.register('deployPrismCompatJars') {
    group = 'deployment'
    description = 'Builds AMI and updates the AMICompat and AMICompatForge Prism Launcher instances.'
    dependsOn deployNeoForgePrismCompatJar
    dependsOn deployForgePrismCompatJar
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Builds and verifies release artifacts before publishing.'
    dependsOn ':fabric:build'
    dependsOn ':forge:verifyForgeReleaseJarReobfuscated'
    dependsOn ':neoforge:build'
    dependsOn 'test'

    def fabricReleaseJar = project(':fabric').layout.buildDirectory.file(
            "libs/${mod_id}-fabric-${fabric_minecraft_version}-${amiEffectiveModVersion}.jar"
    )
    def forgeReleaseJar = project(':forge').layout.buildDirectory.file(
            "release/${mod_id}-forge-${forge_minecraft_version}-${amiEffectiveModVersion}.jar"
    )
    def neoforgeReleaseJar = project(':neoforge').layout.buildDirectory.file(
            "libs/${mod_id}-neoforge-${neoforge_minecraft_version}-${amiEffectiveModVersion}.jar"
    )
    inputs.files(fabricReleaseJar, forgeReleaseJar, neoforgeReleaseJar)

    doLast {
        [fabricReleaseJar, forgeReleaseJar, neoforgeReleaseJar].each { jarProvider ->
            def jar = jarProvider.get().asFile
            if (!jar.isFile()) {
                throw new GradleException("Missing release artifact: ${jar}")
            }
        }
    }
}

